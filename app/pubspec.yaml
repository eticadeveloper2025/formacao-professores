name: formacao_professores
description: App de Formação para Professores - Ética Editora
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  go_router: ^13.2.1
  youtube_player_flutter: ^9.1.1
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  firebase_core: ^3.13.0
  firebase_storage: ^12.4.4
  video_player: ^2.8.6
  image_picker: ^1.1.2
  uuid: ^4.3.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
